<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tako</title>
<style>
  html,body{margin:0;height:100%;background:#FBF8F4;font-family:system-ui,-apple-system,sans-serif;color:#2A1F1A}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  .sp{width:40px;height:40px;border:3px solid #ED715933;border-top-color:#ED7159;border-radius:50%;animation:spin .9s linear infinite}
  b{font-size:18px;font-weight:800} small{color:#8a8079;font-size:13px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!-- Schermata d'avvio dell'app: attende che il motore interno (server Tako
     impacchettato) sia pronto, poi mostra la dashboard. Nessun redirect a server
     esterni: tutto vive dentro l'app. -->
<div class="wrap"><div class="sp"></div><b>Avvio Tako…</b><small id="msg">Avvio del motore interno…</small></div>
<script>
  var TARGET = "http://localhost:4317/staff/index.html"
  var HEALTH = "http://localhost:4317/health"
  var tries = 0
  function poll() {
    tries++
    fetch(HEALTH, { cache: "no-store" })
      .then(function (r) { if (r.ok) { location.replace(TARGET); return } throw 0 })
      .catch(function () {
        var m = document.getElementById("msg")
        if (tries === 12) m.textContent = "Preparazione del database (solo al primo avvio)…"
        if (tries > 360) { m.textContent = "Il motore interno non risponde. Chiudi e riapri l'app."; return }
        setTimeout(poll, 500)
      })
  }
  poll()
</script>
</body>
</html>
