<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#FBF8F4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Tako — Ordina al tavolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

<style>
  :root {
    /* brand (overridable per-restaurant at runtime via --brand) */
    --brand: #ED7159;
    --brand-deep: #D9533A;
    --brand-tint: #FCE7DF;
    --brand-wash: #FBF1ED;
    --on-brand: #FFFFFF;

    /* surfaces — warm neutrals */
    --surface: #FBF8F4;
    --raised: #FFFFFF;
    --sunken: #F4EEE7;
    --hairline: #ECE3D9;

    /* text */
    --ink: #2A1F1A;
    --ink-2: #6B5A50;
    --ink-3: #9A8B82;

    /* states */
    --ok: #4FA882;
    --warn: #E0A23C;
    --danger: #DC4C3E;

    /* radii */
    --r-input: 12px;
    --r-card: 18px;
    --r-sheet: 26px;
    --r-pill: 999px;

    /* soft layered shadows */
    --sh-1: 0 1px 2px rgba(42,31,26,.05), 0 2px 6px rgba(42,31,26,.04);
    --sh-2: 0 2px 8px rgba(42,31,26,.06), 0 8px 24px rgba(42,31,26,.07);
    --sh-3: 0 8px 24px rgba(42,31,26,.10), 0 20px 50px rgba(42,31,26,.14);
    --sh-sheet: 0 -10px 40px rgba(42,31,26,.16);

    /* motion */
    --spring: cubic-bezier(.34,1.56,.64,1);
    --out: cubic-bezier(.22,1,.36,1);
    --inout: cubic-bezier(.66,0,.34,1);

    --app-w: 440px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--brand-wash), transparent 60%),
      #EFE7DD;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior: none;
  }
  h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; }
  .serif { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; letter-spacing: 0; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ——— App stage: center a phone-width column, fill on mobile ——— */
  #root { height: 100%; }
  .stage {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: radial-gradient(120% 90% at 50% 0%, #3a322c 0%, #1a1512 55%, #100c0a 100%);
  }
  .stage--bare {
    display: block;
    height: 100dvh;
    min-height: 0;
    padding: 0;
    background: var(--surface);
  }
  .stage--bare .app { height: 100%; }
  .app {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--surface);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }

  /* generic scroll region */
  .scroll { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { width: 0; height: 0; }
  .noscroll { overflow: hidden; }

  /* ——— Press feedback (haptic-feel) ——— */
  .press { transition: transform .14s var(--spring); touch-action: manipulation; }
  .press:active { transform: scale(0.94); }
  .press-sm:active { transform: scale(0.97); }

  /* ——— Keyframes ——— */
  @keyframes pop-in { 0%{transform:scale(.5);opacity:0} 70%{transform:scale(1.08);opacity:1} 100%{transform:scale(1)} }
  @keyframes float-soft { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-6px) rotate(2deg)} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse-ring { 0%{transform:scale(.7);opacity:.55} 100%{transform:scale(2.4);opacity:0} }
  @keyframes typing-dot { 0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-5px);opacity:1} }
  @keyframes shimmer { 0%{background-position:-180% 0} 100%{background-position:180% 0} }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes ring-bell { 0%,100%{transform:rotate(0)} 15%{transform:rotate(-13deg)} 30%{transform:rotate(11deg)} 45%{transform:rotate(-7deg)} 60%{transform:rotate(5deg)} 75%{transform:rotate(-2deg)} }
  @keyframes badge-pop { 0%{transform:scale(1)} 40%{transform:scale(1.5)} 100%{transform:scale(1)} }
  @keyframes check-pop { 0%{transform:scale(0) rotate(-25deg)} 60%{transform:scale(1.25) rotate(5deg)} 100%{transform:scale(1) rotate(0)} }
  @keyframes rise-fade { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  @keyframes confetti-fall { 0%{transform:translateY(-10px) rotate(0);opacity:1} 100%{transform:translateY(120px) rotate(320deg);opacity:0} }
  @keyframes bubble-rise { 0%{transform:translateY(0) scale(.7);opacity:0} 14%{opacity:.5} 88%{opacity:.4} 100%{transform:translateY(-760px) scale(1.15);opacity:0} }
  @keyframes item-in { 0%{opacity:0;transform:translateY(20px) scale(.95)} 100%{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes pop-soft { 0%{transform:scale(.7);opacity:0} 60%{transform:scale(1.06);opacity:1} 100%{transform:scale(1)} }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-2.5deg)} 75%{transform:rotate(2.5deg)} }

  .anim-float { animation: float-soft 4.5s ease-in-out infinite; }
  .anim-bob { animation: bob 3.4s ease-in-out infinite; transform-origin: 50% 90%; }
  .anim-spin { animation: spin 1s linear infinite; }
  .anim-bell { animation: ring-bell 1.2s var(--inout) infinite; transform-origin: 50% 12%; }

  /* skeleton shimmer */
  .skeleton { background: linear-gradient(100deg, var(--sunken) 30%, #FBF4EC 50%, var(--sunken) 70%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }

  /* food placeholder monogram tile */
  .dish-img {
    position: relative; overflow: hidden; flex: none;
    background: var(--dish-bg, var(--sunken));
    display: grid; place-items: center;
  }
  .dish-img::after {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 10px, transparent 10px 20px);
    mix-blend-mode: soft-light;
  }
  .dish-mono { font-family: 'DM Serif Display', serif; color: rgba(255,255,255,.92); line-height: 1; position: relative; z-index: 1; }

  /* typing dots */
  .tdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
  .tdot:nth-child(1){ animation: typing-dot 1.3s infinite; }
  .tdot:nth-child(2){ animation: typing-dot 1.3s infinite .18s; }
  .tdot:nth-child(3){ animation: typing-dot 1.3s infinite .36s; }

  .hairline { border: 0; border-top: 1px solid var(--hairline); margin: 0; }

  /* hide number input spinners */
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* reduced motion: kill decorative loops, keep transitions snappy */
  @media (prefers-reduced-motion: reduce) {
    .anim-float, .anim-bob, .anim-bell, .anim-spin, .skeleton, .pulse-ring { animation: none !important; }
    .bubbles-layer { display: none !important; }
    * { scroll-behavior: auto !important; }
  }

  /* tweaks panel sits above app */
  .twk-panel { z-index: 2147483646; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tako-data.jsx"></script>
<script type="text/babel" src="tako-i18n.jsx"></script>
<script type="text/babel" src="tako-kit.jsx"></script>
<script type="text/babel" src="tako-menu.jsx"></script>
<script type="text/babel" src="tako-screens.jsx"></script>
<script type="text/babel" src="tako-app.jsx"></script>
</body>
</html>
