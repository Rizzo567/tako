<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tako — Dashboard Ristoratore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ───────────────── Tako Dashboard — design tokens ───────────────── */
  :root {
    /* brand */
    --brand: #ED7159; --brand-deep: #D9533A; --brand-tint: #FCE7DF; --brand-wash: #FBF1ED; --on-brand: #fff;
    /* neutri caldi */
    --bg: #F2EBE2; --surface: #FBF8F4; --raised: #FFFFFF; --sunken: #F4EEE7; --hairline: #E7DDD1;
    /* sidebar dark */
    --nav: #25262A; --nav-2: #313338; --nav-line: rgba(255,255,255,.09); --nav-ink: #E6E6EA; --nav-ink-2: #9B9CA4;
    /* testo */
    --ink: #2A1F1A; --ink-2: #6B5A50; --ink-3: #9A8B82;
    /* stati semantici */
    --ok: #4FA980; --ok-bg: #E4F2EB; --ok-deep: #2F7D58;
    --wait: #E0A23C; --wait-bg: #FAEFD8;
    --info: #5B8DB8; --info-bg: #E2EDF4;
    --danger: #D9534A; --danger-bg: #FAE6E4;
    --muted: #9A8B82; --muted-bg: #EFE8E0;
    /* stati tavoli */
    --st-free: #4FA980; --st-busy: #ED7159; --st-wait: #E0A23C; --st-ready: #5B8DB8; --st-clean: #94A7B5; --st-resv: #A98FCB;
    /* radii */
    --r-xs: 8px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
    /* shadow */
    --sh-1: 0 1px 2px rgba(42,31,26,.05), 0 1px 3px rgba(42,31,26,.04);
    --sh-2: 0 2px 6px rgba(42,31,26,.06), 0 8px 22px rgba(42,31,26,.07);
    --sh-3: 0 10px 30px rgba(42,31,26,.12), 0 24px 60px rgba(42,31,26,.16);
    --sh-pop: 0 18px 50px rgba(42,31,26,.22);
    /* motion */
    --spring: cubic-bezier(.34,1.56,.64,1);
    --out: cubic-bezier(.22,1,.36,1);
    /* fonts */
    --f-display: "Nunito", system-ui, sans-serif;
    --f-ui: "DM Sans", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--f-ui); color: var(--ink); background: #E8DFD3;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  h1,h2,h3,h4 { font-family: var(--f-display); font-weight: 800; letter-spacing: -.01em; margin: 0; }
  .num { font-family: var(--f-display); font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .mono { font-family: var(--f-mono); }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  ::selection { background: var(--brand-tint); }

  /* press feedback */
  .press { transition: transform .14s var(--spring); touch-action: manipulation; }
  .press:active { transform: scale(.95); }

  /* scrollbars */
  .scroll { scrollbar-width: thin; scrollbar-color: var(--hairline) transparent; }
  .scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: #D8CCBD; border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  /* embed lockscroll: l'interfaccia resta navigabile (cliccabile) ma non scorre →
     wheel/touch passano alla pagina ospite */
  html.lockscroll, html.lockscroll body { overflow: hidden !important; height: 100%; }
  html.lockscroll .scroll,
  html.lockscroll .stage-area,
  html.lockscroll .stage-area.mobile { overflow: hidden !important; overscroll-behavior: none; }

  /* tako mascotte float idle */
  @keyframes tako-bob { 0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-7px) rotate(1deg);} }
  .tako-float { animation: tako-bob 4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .tako-float{ animation: none; } }

  /* ===== notifica in arrivo — choreografia ===== */
  @keyframes nb-bell { 0%,100%{transform:rotate(0);} 12%{transform:rotate(-22deg);} 26%{transform:rotate(18deg);} 40%{transform:rotate(-13deg);} 54%{transform:rotate(9deg);} 70%{transform:rotate(-5deg);} 84%{transform:rotate(2deg);} }
  .nb-bell { animation: nb-bell .7s ease-in-out 1; transform-origin: 50% 18%; }
  @keyframes nb-glow { 0%{transform:scale(.6);opacity:.55;} 70%{opacity:0;} 100%{transform:scale(1.7);opacity:0;} }
  .nb-glow { animation: nb-glow 1.1s ease-out infinite; }
  @keyframes nb-tako { 0%{transform:scale(1) rotate(0);} 20%{transform:scale(1.18) rotate(-8deg);} 45%{transform:scale(.96) rotate(6deg);} 70%{transform:scale(1.06) rotate(-3deg);} 100%{transform:scale(1) rotate(0);} }
  .nb-tako { animation: nb-tako .9s cubic-bezier(.34,1.56,.64,1) 1; }
  @keyframes nb-sheen { 0%{transform:translateX(-130%) skewX(-18deg);} 100%{transform:translateX(360%) skewX(-18deg);} }
  .nb-sheen { animation: nb-sheen 1s cubic-bezier(.4,0,.2,1) .15s 1 both; }
  @keyframes nb-pop { 0%{transform:scale(0);} 60%{transform:scale(1.35);} 100%{transform:scale(1);} }
  .nb-pop { animation: nb-pop .45s cubic-bezier(.34,1.7,.5,1) .2s both; }
  @keyframes nb-float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
  .nb-float { animation: nb-float 2.4s ease-in-out infinite; }
  @keyframes nb-textin { from{opacity:0;transform:translateX(8px);} to{opacity:1;transform:translateX(0);} }
  .nb-textin { animation: nb-textin .4s ease .12s both; }

  /* ===== toast desktop ===== */
  @keyframes ds-toast-in { 0%{opacity:0;transform:translateX(120%) scale(.9);} 70%{transform:translateX(-6px) scale(1.02);} 100%{opacity:1;transform:translateX(0) scale(1);} }
  .ds-toast-in { animation: ds-toast-in .5s cubic-bezier(.34,1.4,.5,1) both; }
  @keyframes ds-prog { from{transform:scaleX(1);} to{transform:scaleX(0);} }
  @keyframes ds-toast-icon { 0%{transform:scale(0) rotate(-30deg);} 60%{transform:scale(1.25) rotate(8deg);} 100%{transform:scale(1) rotate(0);} }
  .ds-toast-icon { animation: ds-toast-icon .5s cubic-bezier(.34,1.6,.5,1) .1s both; }
  .skeleton { background: linear-gradient(100deg, var(--sunken) 30%, #FCF7F1 50%, var(--sunken) 70%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; border-radius: 8px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* segmented control */
  .seg { display: inline-flex; gap: 2px; background: var(--sunken); border-radius: var(--r-pill); padding: 3px; }
  .seg button { padding: 8px 14px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; transition: all .18s var(--out); }
  .seg button.on { background: var(--raised); color: var(--ink); box-shadow: var(--sh-1); }

  /* live pulse */
  @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(79,169,128,.5);} 70%{ box-shadow: 0 0 0 7px rgba(79,169,128,0);} 100%{ box-shadow:0 0 0 0 rgba(79,169,128,0);} }
  .live-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--ok); animation: pulse-ring 2.2s infinite; }

  @keyframes pop-in { 0%{ transform: scale(.6); opacity: 0;} 60%{ transform: scale(1.08);} 100%{ transform: scale(1); opacity: 1;} }
  @keyframes slide-in-row { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes rise-fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .pop-in { animation: pop-in .4s var(--spring); }
  .new-row { animation: slide-in-row .45s var(--spring); }

  /* sidebar nav icon hover animation */
  @keyframes ico-pop { 0%{transform:translateY(0) rotate(0);} 30%{transform:translateY(-3px) rotate(-9deg);} 60%{transform:translateY(0) rotate(7deg);} 100%{transform:translateY(0) rotate(0);} }
  .nav-ico { display: flex; transition: transform .15s var(--spring); }
  .nav-item:hover .nav-ico { animation: ico-pop .55s var(--spring); }
  .nav-item:hover { background: rgba(255,255,255,.06); }
  .nav-item.on:hover { background: var(--brand); }
  .bb-tab:hover .nav-ico { animation: ico-pop .55s var(--spring); }

  /* ───────────────── stage / frame toggle chrome ───────────────── */
  #stage { height: 100%; display: flex; flex-direction: column; background: #E8DFD3; }
  .toolbar { flex: none; display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: #1F1714; color: #EDE2D6; }
  .toolbar .brandmark { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 900; font-size: 16px; }
  .toolbar .brandmark img { height: 26px; }
  .toolbar .spacer { flex: 1; }
  .toolbar .tb-label { font-size: 12px; color: #A99A8D; font-weight: 600; }
  .stage-area { flex: 1; min-height: 0; display: flex; align-items: stretch; justify-content: center; overflow: hidden; padding: 0; }
  .stage-area.mobile { padding: 22px; overflow: auto; background: #E8DFD3; }

  /* desktop host fills area */
  .host-desktop { width: 100%; height: 100%; min-height: 0; }
  /* mobile host = phone frame */
  .host-mobile { width: 402px; height: 858px; flex: none; background: #1F1714; border-radius: 46px; padding: 11px; box-shadow: var(--sh-3); }
  .screen { position: relative; overflow: hidden; }
  .host-mobile .screen { width: 100%; height: 100%; background: var(--surface); border-radius: 36px; }
  .host-desktop .screen { width: 100%; height: 100%; background: var(--bg); }

  /* role/view chips in toolbar */
  .tb-chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: var(--r-pill); background: rgba(255,255,255,.08); color: #EDE2D6; font-size: 13px; font-weight: 600; }
  .tb-seg { display: inline-flex; gap: 2px; background: rgba(255,255,255,.08); border-radius: var(--r-pill); padding: 3px; }
  .tb-seg button { padding: 6px 13px; border-radius: var(--r-pill); font-size: 13px; font-weight: 600; color: #A99A8D; }
  .tb-seg button.on { background: var(--brand); color: #fff; }
  select.tb-select { background: rgba(255,255,255,.08); color: #EDE2D6; border: none; border-radius: var(--r-pill); padding: 7px 12px; font-size: 13px; font-weight: 600; font-family: inherit; }
  select.tb-select option { color: #2A1F1A; }
</style>
</head>
