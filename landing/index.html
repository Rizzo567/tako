<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tako — Il tuo ristorante, più smart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Nunito', 'system-ui', 'sans-serif'],
          body: ['Quicksand', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
      },
    },
  };
</script>

<style>
  :root {
    --coral: #ED7159;
    --coral-deep: #D9533A;
    --coral-soft: #F8B7A6;
    --coral-tint: #FFEEE8;
    --cream: #FFF8F3;
    --ink: #2A1F1A;
    --ink-soft: #5C4A41;
    --bow: #2A1F1A;
    --mint: #7FC4A8;
    --sun: #F5C065;
    --sky: #BDD9E8;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow-x: hidden;
  }

  h1, h2, h3, h4, h5 {
    font-family: 'Nunito', system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.02em;
  }

  /* ——— Animations ——— */
  @keyframes float-y {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(-2deg); }
  }
  @keyframes float-soft {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes swim {
    0% { transform: translateX(-30px) translateY(0) rotate(-4deg); }
    50% { transform: translateX(30px) translateY(-10px) rotate(4deg); }
    100% { transform: translateX(-30px) translateY(0) rotate(-4deg); }
  }
  @keyframes pop-in {
    0% { transform: scale(0.4) rotate(-12deg); opacity: 0; }
    70% { transform: scale(1.08) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes blob-1 {
    0%, 100% { border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%; transform: translate(0,0) scale(1); }
    50% { border-radius: 40% 60% 60% 40% / 60% 40% 60% 40%; transform: translate(20px,-20px) scale(1.05); }
  }
  @keyframes blob-2 {
    0%, 100% { border-radius: 50% 50% 60% 40% / 60% 40% 50% 50%; transform: translate(0,0) scale(1); }
    50% { border-radius: 60% 40% 40% 60% / 40% 60% 60% 40%; transform: translate(-30px,15px) scale(1.08); }
  }
  @keyframes draw-tentacle {
    0% { stroke-dashoffset: 1200; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes pulse-ring {
    0% { transform: scale(0.8); opacity: 0.7; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes bell-ring {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-12deg); }
    40% { transform: rotate(10deg); }
    60% { transform: rotate(-6deg); }
    80% { transform: rotate(4deg); }
  }
  @keyframes spin-slow { to { transform: rotate(360deg); } }
  @keyframes logo-bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-3px) rotate(3deg); }
  }
  .logo-bob { animation: logo-bob 3.2s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes drift-bubble {
    0% { transform: translateY(20px) scale(0.9); opacity: 0; }
    20% { opacity: 0.5; }
    100% { transform: translateY(-200px) scale(1.1); opacity: 0; }
  }

  .float-y { animation: float-y 5s ease-in-out infinite; }
  .float-soft { animation: float-soft 4s ease-in-out infinite; }
  .wiggle { animation: wiggle 3s ease-in-out infinite; transform-origin: bottom center; }
  .swim { animation: swim 7s ease-in-out infinite; }
  .blob-1 { animation: blob-1 12s ease-in-out infinite; }
  .blob-2 { animation: blob-2 14s ease-in-out infinite; }
  .spin-slow { animation: spin-slow 30s linear infinite; }
  .bell-ring { animation: bell-ring 0.9s ease-in-out infinite; transform-origin: top center; }
  .pop-in { animation: pop-in 0.7s cubic-bezier(.34,1.56,.64,1) both; }

  /* Reveal on scroll */
  .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s cubic-bezier(.2,.8,.2,1), transform 0.8s cubic-bezier(.2,.8,.2,1); }
  .reveal.in { opacity: 1; transform: translateY(0); }
  .reveal-l { opacity: 0; transform: translateX(-60px); transition: opacity 0.9s ease, transform 0.9s cubic-bezier(.2,.8,.2,1); }
  .reveal-l.in { opacity: 1; transform: translateX(0); }
  .reveal-r { opacity: 0; transform: translateX(60px); transition: opacity 0.9s ease, transform 0.9s cubic-bezier(.2,.8,.2,1); }
  .reveal-r.in { opacity: 1; transform: translateX(0); }
  .reveal-pop { opacity: 0; transform: scale(0.7) rotate(-6deg); transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.34,1.56,.64,1); }
  .reveal-pop.in { opacity: 1; transform: scale(1) rotate(0); }

  /* Mascot images — transparent PNGs */
  .mascot { filter: drop-shadow(0 18px 30px rgba(217,83,58,0.18)); }
  .mascot-hero { filter: drop-shadow(0 30px 40px rgba(217,83,58,0.28)); }

  /* Glass nav */
  .glass {
    background: rgba(255, 248, 243, 0.72);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-bottom: 1px solid rgba(237, 113, 89, 0.12);
  }

  /* Squiggle underline */
  .squiggle {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 8'><path d='M0 4 Q 7.5 0, 15 4 T 30 4 T 45 4 T 60 4' fill='none' stroke='%23ED7159' stroke-width='3' stroke-linecap='round'/></svg>");
    background-repeat: repeat-x;
    background-position: 0 100%;
    background-size: 60px 8px;
    padding-bottom: 12px;
  }

  /* Coral btn */
  .btn-coral {
    background: var(--coral);
    color: white;
    border-radius: 999px;
    font-weight: 800;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s, background .2s;
    box-shadow: 0 6px 0 var(--coral-deep), 0 12px 24px rgba(217,83,58,0.28);
  }
  .btn-coral:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 0 var(--coral-deep), 0 16px 30px rgba(217,83,58,0.35); }
  .btn-coral:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--coral-deep), 0 4px 12px rgba(217,83,58,0.25); }

  .btn-ghost {
    background: white;
    color: var(--ink);
    border-radius: 999px;
    font-weight: 800;
    border: 2px solid var(--ink);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .2s;
    box-shadow: 0 6px 0 var(--ink);
  }
  .btn-ghost:hover { transform: translateY(-2px); background: var(--coral-tint); }
  .btn-ghost:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }

  /* Card with chunky shadow */
  .chunky {
    background: white;
    border-radius: 28px;
    border: 2px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
  }
  .chunky:hover { transform: translate(-3px, -3px); box-shadow: 12px 12px 0 var(--ink); }

  .chunky-coral {
    background: var(--coral);
    color: white;
    border-radius: 28px;
    border: 2px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
  }

  /* Wavy divider */
  .wave-divider svg { display: block; width: 100%; height: 80px; }

  /* Bubbles bg */
  .bubble {
    position: absolute;
    bottom: -40px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(189,217,232,0.25));
    border: 2px solid rgba(189,217,232,0.6);
    animation: drift-bubble linear infinite;
  }

  /* Tentacle SVG draw */
  .tentacle-path {
    fill: none;
    stroke: var(--coral);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 1200;
    stroke-dashoffset: 1200;
  }
  .tentacle-path.in { animation: draw-tentacle 2.4s ease forwards; }

  /* Star */
  .star { color: #F5C065; }

  /* Section spacing */
  section { position: relative; }

  /* Decorative dot grid */
  .dot-grid {
    background-image: radial-gradient(rgba(42,31,26,0.18) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
  }

  /* Chip */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: white;
    border: 2px solid var(--ink);
    font-weight: 700;
    font-size: 14px;
  }

  /* Phone frame */
  .phone {
    background: var(--ink);
    border-radius: 42px;
    padding: 10px;
    box-shadow: 0 30px 60px rgba(42,31,26,0.25), inset 0 0 0 2px rgba(255,255,255,0.08);
  }
  .phone-screen {
    background: var(--cream);
    border-radius: 32px;
    overflow: hidden;
  }

  /* Typing dots */
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
  .dot:nth-child(1) { animation: typing 1.2s infinite; }
  .dot:nth-child(2) { animation: typing 1.2s infinite 0.2s; }
  .dot:nth-child(3) { animation: typing 1.2s infinite 0.4s; }

  /* Hover micro */
  .hover-rise { transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  .hover-rise:hover { transform: translateY(-6px) rotate(-1deg); }

  /* Pricing highlight */
  .ring-coral { box-shadow: 0 0 0 4px var(--coral-tint), 8px 8px 0 var(--ink); }

  /* Scrollbar polish */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--cream); }
  ::-webkit-scrollbar-thumb { background: var(--coral-soft); border-radius: 999px; }

  /* Tweaks button styling tweaks */
  .tweaks-trigger { z-index: 60; }

  /* Gradient text */
  .grad-text {
    background: linear-gradient(90deg, var(--coral) 0%, var(--coral-deep) 60%, #B5391F 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* Sticky-marquee tape */
  .tape {
    background: var(--ink);
    color: var(--cream);
    transform: rotate(-1.5deg);
  }

  /* For screen mockup chat */
  .bubble-them {
    background: var(--coral-tint);
    color: var(--ink);
    border-radius: 22px 22px 22px 6px;
    padding: 12px 16px;
    max-width: 85%;
  }
  .bubble-me {
    background: var(--ink);
    color: var(--cream);
    border-radius: 22px 22px 6px 22px;
    padding: 12px 16px;
    max-width: 85%;
    margin-left: auto;
  }

  /* Floating spaghetti sparkle */
  .sparkle { position: absolute; width: 14px; height: 14px; }
  .sparkle::before, .sparkle::after {
    content:''; position: absolute; inset: 0;
    background: var(--sun); border-radius: 2px;
  }
  .sparkle::before { transform: scaleX(0.25); }
  .sparkle::after { transform: scaleY(0.25); }

  /* Tablet mockup */
  .tablet-frame {
    background: var(--ink);
    border-radius: 22px;
    padding: 8px;
    box-shadow: 0 30px 60px rgba(42,31,26,0.25);
  }

  /* Number marker */
  .step-num {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--coral);
    color: white;
    display: grid;
    place-items: center;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 28px;
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }

  /* Marquee */
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .marquee-track { animation: marquee 30s linear infinite; }

  /* ——— Hand-holding-phone showcase (hero) ——— */
  .hp-stage {
    position: relative;
    width: min(420px, 46vw);
    margin-left: auto;
    aspect-ratio: 1536 / 2752;
    transform-origin: 50% 92%;
    --app-w: 390px;
    filter: drop-shadow(0 34px 54px rgba(20,18,40,.30));
  }
  .hp-slot {
    position: absolute;
    left: 31.32%; top: 16.39%;
    width: 44.53%; height: 55.78%;
    overflow: hidden; background: #fff; z-index: 1;
    border-radius: 8px;
  }
  .hp-live {
    position: absolute; top: 0; left: 0;
    width: var(--app-w, 390px);
    height: calc(var(--app-w, 390px) * 2.244);
    border: 0; transform-origin: top left;
    transform: scale(var(--hp-scale, .43));
    pointer-events: none;
  }
  .hp-hand {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 2; pointer-events: none; display: block;
    -webkit-mask-image: linear-gradient(to bottom,#000 0 70%,rgba(0,0,0,.72) 80%,rgba(0,0,0,.34) 88%,transparent 95%);
            mask-image: linear-gradient(to bottom,#000 0 70%,rgba(0,0,0,.72) 80%,rgba(0,0,0,.34) 88%,transparent 95%);
  }
  @keyframes handSway {
    0%   { transform: translateX(-16px) rotate(-3deg); }
    50%  { transform: translateX(16px) rotate(3deg); }
    100% { transform: translateX(-16px) rotate(-3deg); }
  }
  .hp-stage.sway { animation: handSway 3.6s cubic-bezier(.45,0,.55,1) infinite; }
  @media (prefers-reduced-motion: reduce) { .hp-stage.sway { animation: none; } }
  @media (max-width: 820px) {
    .hp-stage { width: min(340px, 82vw); margin: 0 auto; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tako-sections.jsx"></script>

<script type="text/babel" src="tako-pages.jsx"></script>
<script type="text/babel" src="tako-app.jsx"></script>
</body>
</html>
