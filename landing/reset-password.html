<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- SEC-013: nessun referrer (il token viaggia in query string) -->
<meta name="referrer" content="no-referrer" />
<title>Tako — Reimposta password</title>
<script>
  /* La email del backend punta a /reset-password?token=… (path pulito).
     Il sito è statico (router ?p=): inoltro alla pagina router preservando il token,
     senza perdere il referrer (no-referrer impostato sopra) né ricaricare la history. */
  (function () {
    var qs = window.location.search || '';
    var sep = qs ? (qs.indexOf('?') === 0 ? '&' : '?') : '';
    var target = 'Tako%20Pagine.html?p=reset' + (qs ? sep + qs.replace(/^\?/, '') : '');
    window.location.replace(target);
  })();
</script>
</head>
<body>
<noscript><p>Attiva JavaScript per reimpostare la password, oppure <a href="Tako%20Pagine.html?p=reset">riprova qui</a>.</p></noscript>
<p>Reindirizzamento…</p>
</body>
</html>
