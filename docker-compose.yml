version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tako-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tako
      POSTGRES_PASSWORD: tako
      POSTGRES_DB: takodb
    volumes:
      - tako-postgres-data:/var/lib/postgresql/data
    # Port 5432 intentionally not exposed to host — only accessible within Docker network.
    # In production, remove these two lines. Kept for local dev convenience.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tako']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tako-redis
    restart: unless-stopped
    # Port 6379 bound to localhost only — not exposed to external interfaces.
    # In production, remove this port binding entirely.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - tako-redis-data:/data

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: tako-server
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://tako:tako@postgres:5432/takodb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3001
      CLIENT_BASE_URL: ${CLIENT_BASE_URL:-http://localhost:3002}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - tako-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: tako-dashboard
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://server:3001
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
    depends_on:
      - server

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: tako-web
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NEXT_PUBLIC_API_URL: http://server:3001
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
    depends_on:
      - server

volumes:
  tako-postgres-data:
  tako-redis-data:
  tako-uploads:
